- "Говорятъ, поставщикъ всё-таки отгрузилъ. Проверять не станемъ: слухи слухами, а недѣля — на этой."
- "По типографіи ходитъ слухъ, что восьмой винтъ нашёлся. Гвоздь Иванычъ молчитъ и смотритъ на тапку."
- "Слухаютъ, корректоръ собирается въ отпускъ. Корректоръ опровергаетъ: «Это враждебный слухъ»."
- "Говорятъ, сосѣдъ сверху повѣсилъ картину по уровню. Стѣны въ курсѣ и вздрагиваютъ по-прежнему."
- "Ходятъ слухи, что маршрутъ «пять километровъ по ровному» возвращаютъ съ улыбкой. Провѣрки не было."
- "По слухамъ, главредъ прочёл депешу до конца. Редакція празднуетъ третій день."
- "Слухаютъ, въ отдѣлѣ закупокъ отвѣчаютъ не «ок», а цѣлымъ предложеніемъ. Очевидцевъ нѣтъ."
- "Говорятъ, паяльникъ исправенъ. Хозяинъ утверждаетъ, что къ нему не прикасался."
- "По типографіи говорятъ: приборъ, собранный съ тремя лишними деталями, работаетъ лучше прежняго."
- "Слухаютъ, завѣдующій объявленіями объявился. Объявленія съ тех пор приходятъ вѣжливые."
- "Говорятъ, почтальонъ узналъ точный адресъ типографіи. Ждёмъ писемъ и объяснений."
- "Ходятъ слухи, что курсъ «улыбка къ терпѣнію» дрогнулъ. Финансовый отдѣлъ улыбается и терпитъ."
- "Слухаютъ, въ Шэньчжэнѣ наступила «следующая недѣля». Мѣстные поставщики въ смятеніи."
- "Говорятъ, штампъ «Цензурой дозволено» вчера вжимали. Цензура довольна."
- "По слухамъ, издатель поѣхалъ лично провѣрить отгрузку. Издатель съ вечера не выходитъ на связь."
- "Слухаютъ, кто-то видѣлъ сосѣда съ перфораторомъ безъ перфоратора. Домъ не вѣритъ."
- "Говорятъ, Прасковья Степановна нашла въ текстѣ опечатку. Всѣ ждутъ, где именно."
- "Ходятъ слухи: терпѣніе, купленное оптомъ, подорожало. Отдѣлъ закупокъ называетъ это «рынокъ»."
- "Слухаютъ, телефонъ довѣрія отвѣтилъ живымъ человѣкомъ. Абонентъ до сих поръ не оправился."
- "Говорятъ, готовится особый выпускъ. Готовится онъ, впрочемъ, съ начала XX вѣка."
