{{ define "main" }}
<section class="rubric">
  <h2>{{ .Title }}</h2>
  {{ .Content }}
  {{ range .Pages.ByDate.Reverse }}
    <article class="item">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <time>{{ .Date.Format "02.01.2006" }}</time>
      <p>{{ .Summary }}</p>
    </article>
  {{ else }}
    <p class="empty">Въ этой рубрикѣ пока ни строчки.</p>
  {{ end }}
</section>
{{ end }}
