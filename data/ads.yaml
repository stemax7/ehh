- text: "Куплю терпѣніе. Оптомъ, для переписки съ поставщиками."
  contact: "спросить въ отдѣлѣ закупокъ"
- text: "Отдамъ въ хорошія руки графикъ работъ. Самъ не пригодился — поставщикъ его не подтвердилъ."
  contact: "типографія"
- text: "Обмѣняю обѣщаніе «на этой недѣлѣ» на «вчера». С доплатой."
  contact: "кабинетъ 47"
- text: "Требуется корректоръ со стажемъ третій вѣкъ. Опытъ работы съ ятемъ обязателенъ."
  contact: "Прасковья Степановна"
- text: "Продамъ перфораторъ. Работалъ дважды: при покупкѣ и въ 8:03."
  contact: "подъѣздъ № 3"
- text: "Куплю восьмой винтъ. Семь штукъ уже есть, приборъ не собирается."
  contact: "Гвоздь Иванычъ"
- text: "Сниму квартиру безъ соседей съ перфораторомъ. Готовъ платить двойную цѣну."
  contact: "писать въ типографію"
- text: "Отдамъ даромъ лишнія детали отъ прибора. Приборъ шелъ въ комплектѣ."
  contact: "самовывозъ, по расписанію"
- text: "Требуется поставщикъ, который говоритъ «уже отгрузилъ» — и отгрузилъ."
  contact: "срочно, для редакціи и всѣхъ остальныхъ"
- text: "Обучаю пониманію чертежей. Первый урокъ бесплатно: линія — это не точка."
  contact: "по вторникамъ, въ отсутствіе перфоратора"
- text: "Потеряна недѣля. Нашедшаго просятъ вернуть туда же, куда она пропала."
  contact: "кабинетъ 47"
- text: "Отремонтирую «оно само». Гарантія: сломается само."
  contact: "спецкоръ по ремонту"
- text: "Требуется мастеръ съ отвёрткой. Своя отвёртка осталась внутри прибора."
  contact: "подъѣздъ № 3, кв. 47"
- text: "Продамъ курсъ валютъ «улыбка къ терпѣнію». Курсъ стабиленъ, спросъ падаетъ."
  contact: "отдѣлъ финансовъ"
- text: "Обмѣняю «только на минутку» на «никогда». Условія обмѣна — никакихъ."
  contact: "по воскресеньямъ, до 8:00"
- text: "Куплю глухіе наушники. Для работы, для дома, для жизни."
  contact: "типографія"
- text: "Предоставляю услугу: скажу «тутъ дѣла на пять минутъ» и сломаю что угодно."
  contact: "телефонъ довѣрія, автоответчикъ"
- text: "Требуется сосѣдъ безъ перфоратора. Опытъ тишины обязателенъ."
  contact: "весь домъ"
- text: "Куплю календарь безъ недѣли «следующей». Для поставщиковъ недоступенъ."
  contact: "отдѣлъ снабженія"
- text: "Сниму складъ для накопленныхъ безобразій. Подвалъ, сухость, тишина."
  contact: "главредъ"
- text: "Обучаю разговорному «ок» и «thank you». Уровень поставщика — за недѣлю."
  contact: "Шэньчжэнь, онлайнъ"
- text: "Продамъ штампъ «Цензурой дозволено». Б/у, почти не вжимался."
  contact: "зав. объявленіями"
- text: "Требуется корреспондентъ въ Шэньчжэнь. Столъ, стулъ, надежда."
  contact: "отдѣлъ депешей"
- text: "Отдамъ даромъ маршрутъ «пять километровъ по ровному». Вернули безъ улыбки."
  contact: "рубрика «Залётные»"
- text: "Куплю табличку «Не беспокоить». Для двери, для совѣсти, для поставщика."
  contact: "кабинетъ 47"
- text: "Сниму перфораторъ посуточно. Для сверленія и выравниванія картинъ."
  contact: "сосѣдъ сверху"
- text: "Предлагаю партнерство: я обѣщаю, вы ждете. Опытъ — пять лѣтъ."
  contact: "всякаго рода отгрузки"
- text: "Куплю будильникъ, который не звонитъ въ 8:03. Подержанный, безъ перфоратора."
  contact: "подъѣздъ № 3"
- text: "Отдамъ въ добрыя руки приборъ. Лишнія детали — въ подарокъ."
  contact: "Гвоздь Иванычъ, после 20:31"
