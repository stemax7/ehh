<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} — {{ site.Params.motto }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" sizes="32x32">
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:site_name" content="{{ site.Title }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.motto }}. {{ site.Params.submotto }}{{ end }}">
  {{ with .Params.image }}
  <meta property="og:image" content="{{ . | absURL }}">
  {{ else }}
  <meta property="og:image" content="{{ "/og-cover.png" | absURL }}">
  {{ end }}
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
<div class="sheet">
  {{ partial "masthead.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
</div>
{{ if not hugo.IsServer }}
<script data-goatcounter="{{ site.Params.goatcounter }}"
  async src="//gc.zgo.at/count.js"></script>
<script>
// Тиражъ: общее число просмотровъ (кэшъ счётчика — до четырёхъ часовъ).
fetch('{{ replace site.Params.goatcounter "/count" "/counter/TOTAL.json" }}')
  .then(function (r) { return r.json() })
  .then(function (d) {
    var n = parseInt(d.count, 10);
    if (isNaN(n)) return;
    document.querySelectorAll('.tirazh-n').forEach(function (el) {
      el.textContent = n.toLocaleString('ru-RU');
    });
    var t = document.querySelector('.tirazh');
    if (t) t.style.visibility = 'visible';
  })
  .catch(function () { /* счётчикъ недоступенъ — тиражъ не выводимъ */ });
</script>
{{ end }}
</body>
</html>
