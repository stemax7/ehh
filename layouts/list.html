{{ define "main" }}
<section class="rubric">
  <h1 class="rubric-title">{{ .Title }}</h1>
  {{ .Content }}
  {{ range .Pages.ByWeight }}
    <article class="item">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <time>{{ .Date.Format "02.01.2006" }}</time>
      {{ with .Description }}
      <p class="summary">{{ . }}</p>
      {{ else }}
      <div class="summary">{{ $.Summary }}</div>
      {{ end }}
    </article>
  {{ else }}
    <p class="empty">Въ этой рубрикѣ пока ни строчки.</p>
  {{ end }}
</section>
{{ end }}
