<header class="masthead">
  <div class="meta">
    <span>Нумеръ {{ site.Params.issue }}</span>
    <span>{{ site.Params.date }}</span>
    <span>Цѣна: улыбка</span>
  </div>
  {{ if .IsHome }}<h1 class="title">{{ else }}<div class="title">{{ end }}
    <a href="/" class="frame">ЭХЪ!</a>
  {{ if .IsHome }}</h1>{{ else }}</div>{{ end }}
  <p class="motto">{{ site.Params.motto }}</p>
  <p class="submotto">{{ site.Params.submotto }}</p>
  <nav class="nav">
  {{ range site.Sections }}
    <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
  {{ end }}
  </nav>
</header>
